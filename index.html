
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>PILTAE CHAT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #080b12;
      color: #e8ecf7;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 780px;
      height: min(780px, 90vh);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #101522;
      border: 1px solid #27334a;
      border-radius: 18px;
      box-shadow: 0 0 45px #0066ff18;
    }

    header {
      padding: 22px;
      background: #131b2b;
      border-bottom: 1px solid #27334a;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: 3px;
    }

    h1 span { color: #5da7ff; }

    #status {
      color: #9aa9c2;
      font-size: 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 14px;
      background: #192235;
      border: 1px solid #293852;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: #76b2ff;
      font-size: 12px;
    }

    .time { color: #8491a8; }

    .body {
      white-space: pre-wrap;
      line-height: 1.45;
    }

    #notice {
      padding: 0 16px 10px;
      color: #9aa9c2;
      font-size: 12px;
    }

    form {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 9px;
      padding: 14px;
      background: #131b2b;
      border-top: 1px solid #27334a;
    }

    input, button {
      min-width: 0;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
    }

    input {
      color: white;
      background: #0b101c;
      border: 1px solid #34425c;
      outline: none;
    }

    input:focus { border-color: #5da7ff; }

    button {
      border: 0;
      background: #3988ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #2675eb; }
    button:disabled { opacity: .5; cursor: wait; }

    @media (max-width: 540px) {
      body { padding: 8px; }
      .app { height: 94vh; }
      form { grid-template-columns: 1fr auto; }
      #username { grid-column: 1 / -1; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>PILTAE <span>CHAT</span></h1>
      <div id="status">Connecting to chat...</div>
    </header>

    <section id="messages" aria-live="polite"></section>

    <div id="notice">
      Public group chat — be respectful. Don't share personal information.
    </div>

    <form id="chatForm">
      <input
        id="username"
        maxlength="24"
        placeholder="Your name"
        required
        autocomplete="nickname"
      >

      <input
        id="content"
        maxlength="500"
        placeholder="Type a message..."
        required
        autocomplete="off"
      >

      <button id="send" type="submit">SEND</button>
    </form>
  </main>

  <script>
    // Replace this placeholder with your actual Supabase Project URL.
    const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";

    // Your public publishable key.
    const SUPABASE_KEY =
      "sb_publishable_QgtDI4HQihh_CKILw9iK1g_emOKNWOe";

    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const usernameEl = document.getElementById("username");
    const contentEl = document.getElementById("content");
    const sendButton = document.getElementById("send");

    let client = null;
    let sending = false;
    let lastSentAt = 0;
    let channel = null;

    function showStatus(message) {
      statusEl.textContent = message;
    }

    function renderMessage(message) {
      // Avoid duplicates when realtime and refresh both receive a message.
      if (messagesEl.querySelector(`[data-id="${message.id}"]`)) {
        return;
      }

      const item = document.createElement("article");
      item.className = "message";
      item.dataset.id = String(message.id);

      const meta = document.createElement("div");
      meta.className = "meta";

      const name = document.createElement("strong");
      name.textContent = message.username;

      const time = document.createElement("span");
      time.className = "time";

      const date = new Date(message.created_at);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });

      const body = document.createElement("div");
      body.className = "body";

      // textContent prevents user messages from being interpreted as HTML.
      body.textContent = message.content;

      meta.append(name, time);
      item.append(meta, body);
      messagesEl.appendChild(item);

      while (messagesEl.children.length > 200) {
        messagesEl.firstElementChild.remove();
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await client
        .from("messages")
        .select("id, username, content, created_at")
        .order("id", { ascending: true })
        .limit(100);

      if (error) {
        showStatus("Database error: " + error.message);
        return;
      }

      data.forEach(renderMessage);
    }

    async function startChat() {
      if (
        SUPABASE_URL.includes("PASTE_") ||
        !SUPABASE_URL.startsWith("https://") ||
        SUPABASE_KEY.includes("PASTE_")
      ) {
        showStatus("Setup needed: add your Supabase Project URL.");
        return;
      }

      if (!window.supabase) {
        showStatus("Chat library failed to load. Refresh and try again.");
        return;
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      await loadMessages();

      channel = client
        .channel("public-messages")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          payload => renderMessage(payload.new)
        )
        .subscribe(state => {
          if (state === "SUBSCRIBED") {
            showStatus("ONLINE · Live group chat");
          } else if (state === "CHANNEL_ERROR") {
            showStatus("Live updates unavailable. Refresh to retry.");
          } else if (state === "CLOSED") {
            showStatus("Chat connection closed. Refresh to reconnect.");
          }
        });

      // Refresh messages periodically as a fallback.
      setInterval(loadMessages, 15000);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!client || sending) return;

      const username = usernameEl.value.trim();
      const content = contentEl.value.trim();

      if (!username || !content) return;

      if (username.length > 24 || content.length > 500) {
        showStatus("Name or message is too long.");
        return;
      }

      if (Date.now() - lastSentAt < 1500) {
        showStatus("Please wait a moment before sending again.");
        return;
      }

      sending = true;
      sendButton.disabled = true;
      showStatus("Sending message...");

      try {
        const { error } = await client
          .from("messages")
          .insert({ username, content });

        if (error) {
          showStatus("Couldn't send: " + error.message);
          return;
        }

        lastSentAt = Date.now();
        contentEl.value = "";
        contentEl.focus();
        showStatus("Message sent!");
      } catch (error) {
        showStatus("Connection error. Please try again.");
      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    });

    startChat();
  </script>
</body>
</html>
