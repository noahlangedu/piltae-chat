
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>PILTAE CHAT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #101522;
      --panel2: #131b2b;
      --border: #293852;
      --blue: #5da7ff;
      --text: #e8ecf7;
      --muted: #9aa9c2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #102346 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: min(820px, 92vh);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 80px #0008;
    }

    header {
      padding: 22px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #1c3b67;
      border: 1px solid #3867a4;
      color: white;
      font-weight: 900;
      font-size: 20px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 23px;
      letter-spacing: 3px;
    }

    h1 span { color: var(--blue); }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    #status {
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto 0;
      padding: 24px 12px;
      text-align: center;
      color: var(--muted);
    }

    .welcome strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 19px;
    }

    .message {
      padding: 12px 14px;
      background: #192235;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: var(--blue);
      font-size: 12px;
    }

    .time {
      color: #8491a8;
      white-space: nowrap;
    }

    .body {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #notice {
      padding: 0 16px 12px;
      color: var(--muted);
      font-size: 11px;
    }

    form {
      display: grid;
      grid-template-columns: 135px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 14px;
      background: var(--panel2);
      border-top: 1px solid var(--border);
    }

    input, button {
      min-width: 0;
      padding: 12px;
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
    }

    input {
      width: 100%;
      color: white;
      background: #0b101c;
      border: 1px solid #34425c;
      outline: none;
    }

    input:focus { border-color: var(--blue); }

    button {
      border: 0;
      background: #3988ff;
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover { background: #2675eb; }
    button:disabled { opacity: .5; cursor: wait; }

    @media (max-width: 560px) {
      body { padding: 7px; }
      .app { height: 94vh; }
      header { padding: 17px; }
      form { grid-template-columns: 1fr auto; }
      #username { grid-column: 1 / -1; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">P</div>
        <div>
          <h1>PILTAE <span>CHAT</span></h1>
          <div class="subtitle">ONE CHAT. EVERYWHERE.</div>
        </div>
      </div>
      <div id="status">Connecting to database...</div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <strong>Welcome to PILTAE CHAT</strong>
        Connecting you to the community...
      </div>
    </section>

    <div id="notice">
      Public chat: anyone can read and post messages. Don't share private information.
    </div>

    <form id="chatForm">
      <input
        id="username"
        maxlength="24"
        placeholder="Your name"
        aria-label="Your name"
        required
        autocomplete="nickname"
      >

      <input
        id="content"
        maxlength="500"
        placeholder="Type a message..."
        aria-label="Message"
        required
        autocomplete="off"
      >

      <button id="send" type="submit">SEND</button>
    </form>
  </main>

  <script>
    const SUPABASE_URL =
      "https://trjuphmbtcmijlknzspr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_QgtDI4HQihh_CKILw9iK1g_emOKNWOe";

    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const usernameEl = document.getElementById("username");
    const contentEl = document.getElementById("content");
    const sendButton = document.getElementById("send");

    let client = null;
    let sending = false;
    let lastSentAt = 0;
    let refreshTimer = null;

    function showStatus(message) {
      statusEl.textContent = message;
    }

    function renderMessage(message) {
      if (messagesEl.querySelector(`[data-id="${message.id}"]`)) {
        return;
      }

      if (welcomeEl) welcomeEl.remove();

      const item = document.createElement("article");
      item.className = "message";
      item.dataset.id = String(message.id);

      const meta = document.createElement("div");
      meta.className = "meta";

      const name = document.createElement("strong");
      name.textContent = message.username;

      const time = document.createElement("span");
      time.className = "time";

      const date = new Date(message.created_at);
      time.textContent = Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });

      const body = document.createElement("div");
      body.className = "body";

      // Display messages as text, never as executable HTML.
      body.textContent = message.content;

      meta.append(name, time);
      item.append(meta, body);
      messagesEl.appendChild(item);

      while (messagesEl.children.length > 200) {
        messagesEl.firstElementChild.remove();
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadMessages() {
      if (!client) return;

      const { data, error } = await client
        .from("messages")
        .select("id, username, content, created_at")
        .order("id", { ascending: true })
        .limit(100);

      if (error) {
        showStatus("Database error: " + error.message);
        return;
      }

      data.forEach(renderMessage);
    }

    async function startChat() {
      if (!window.supabase) {
        showStatus("Chat library failed to load. Refresh the page.");
        return;
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      await loadMessages();

      client
        .channel("piltae-public-messages")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages"
          },
          event => renderMessage(event.new)
        )
        .subscribe(state => {
          if (state === "SUBSCRIBED") {
            showStatus("● ONLINE — Live group chat");
          } else if (state === "CHANNEL_ERROR") {
            showStatus("Live connection unavailable; checking periodically.");
          } else if (state === "CLOSED") {
            showStatus("Connection closed. Refresh to reconnect.");
          }
        });

      // Fallback refresh if realtime updates fail.
      refreshTimer = setInterval(loadMessages, 15000);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!client || sending) return;

      const username = usernameEl.value.trim();
      const content = contentEl.value.trim();

      if (!username || !content) return;

      if (username.length > 24 || content.length > 500) {
        showStatus("Your name or message is too long.");
        return;
      }

      if (Date.now() - lastSentAt < 1500) {
        showStatus("Please wait a moment before sending again.");
        return;
      }

      sending = true;
      sendButton.disabled = true;
      showStatus("Sending message...");

      try {
        const { error } = await client
          .from("messages")
          .insert({ username, content });

        if (error) {
          showStatus("Couldn't send: " + error.message);
          return;
        }

        lastSentAt = Date.now();
        contentEl.value = "";
        contentEl.focus();
        showStatus("Message sent!");
      } catch (error) {
        showStatus("Connection error. Please try again.");
      } finally {
        sending = false;
        sendButton.disabled = false;
      }
    });

    startChat();
  </script>
</body>
</html>
